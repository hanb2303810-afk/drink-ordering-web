# CI nghiệm thu: server (Java) + client (React) chạy song song cho từng PR/commit main.
# Server bắt buộc qua ngưỡng JaCoCo của nhóm (Line >= 80%, Branch >= 75%) - đỏ là chặn merge.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  server:
    name: server (mvn verify + JaCoCo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests + JaCoCo coverage check
        run: mvn -B verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: server/target/site/jacoco
          retention-days: 7

  client:
    name: client (npm build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build
